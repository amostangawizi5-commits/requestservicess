services:
  - type: web
    name: portfolio-backend
    runtime: node
    rootDir: Backend
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: portfolio-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
  - type: web
    name: portfolio-frontend
    runtime: static
    rootDir: frontend
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_BACKEND_HOSTNAME
        fromService:
          type: web
          name: portfolio-backend
          envVarKey: RENDER_EXTERNAL_HOSTNAME
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: portfolio-db
    databaseName: myportifolio
    user: portfolio_user
    plan: free
